name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Relay.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid project version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version.' }
          if (-not (Test-Path "docs/releases/$version.md")) { throw 'Release notes missing.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Prepare WebView2 and installer compiler
        shell: pwsh
        run: ./scripts/Ensure-WebView2.ps1
      - name: Cross-platform provider script parity
        run: python scripts/Test-platform-parity.py
      - name: Build, smoke test, and package
        shell: pwsh
        run: ./scripts/Build.ps1 -SmokeTest -Installer
      - name: Verify portable update replacement and rollback
        shell: powershell
        run: ./scripts/Test-Updater.ps1
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-diagnostics
          path: |
            artifacts/*.txt
            artifacts/*.log
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            dist/Relay-*-Setup-x64.exe
            dist/Relay-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: dist
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Relay $VERSION" --notes-file "docs/releases/$VERSION.md"
