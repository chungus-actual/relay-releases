<text x="572.0" y="180.5" font-size="13" fill="#59636e" text-anchor="middle">WebView2 or</text>
<text x="572.0" y="197.5" font-size="13" fill="#59636e" text-anchor="middle">WebKit</text>
<g filter="url(#lift)"><rect x="716" y="52" width="208" height="76" rx="11" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/></g>
<defs><linearGradient id="wash-rail-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a8f6e" stop-opacity="0.1"/><stop offset="1" stop-color="#1a8f6e" stop-opacity="0"/></linearGradient></defs>
<rect x="716.5" y="52.5" width="207" height="44" rx="10.5" fill="url(#wash-rail-light)"/>
<text x="820.0" y="73.0" font-size="11" font-weight="700" letter-spacing="1.3" fill="#1a8f6e" text-anchor="middle">UNREAD COUNT</text>
