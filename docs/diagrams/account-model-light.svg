<rect x="36.5" y="292.5" width="185" height="44" rx="10.5" fill="url(#wash-pane-light)"/>
<text x="129.0" y="313.0" font-size="11" font-weight="700" letter-spacing="1.3" fill="#1a8f6e" text-anchor="middle">LAYOUT</text>
<text x="129.0" y="334.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">A pane</text>
<text x="129.0" y="353.0" font-size="13" fill="#59636e" text-anchor="middle">up to four at once</text>
<text x="262" y="312" font-size="12.5" fill="#59636e" text-anchor="start">Each account gets a profile of its own:</text>
<text x="262" y="330" font-size="12.5" fill="#59636e" text-anchor="start">two Gmail accounts never share a sign-in.</text>
<text x="262" y="354" font-size="12.5" fill="#59636e" text-anchor="start">Relay reads signals off the page; the site</text>
<text x="262" y="372" font-size="12.5" fill="#59636e" text-anchor="start">and the engine keep your data.</text>
