<text x="820.0" y="113.0" font-size="13" fill="#59636e" text-anchor="middle">and the Activity list</text>
<g filter="url(#lift)"><rect x="716" y="160" width="208" height="76" rx="11" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/></g>
<defs><linearGradient id="wash-bar-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6700" stop-opacity="0.1"/><stop offset="1" stop-color="#9a6700" stop-opacity="0"/></linearGradient></defs>
<rect x="716.5" y="160.5" width="207" height="44" rx="10.5" fill="url(#wash-bar-light)"/>
<text x="820.0" y="181.0" font-size="11" font-weight="700" letter-spacing="1.3" fill="#9a6700" text-anchor="middle">WHAT IS PLAYING</text>
<text x="820.0" y="202.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Title bar controls</text>
