<rect x="716.5" y="268.5" width="207" height="44" rx="10.5" fill="url(#wash-note-light)"/>
<text x="820.0" y="289.0" font-size="11" font-weight="700" letter-spacing="1.3" fill="#8250df" text-anchor="middle">NOTIFICATIONS</text>
<text x="820.0" y="310.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Desktop toast</text>
<text x="820.0" y="329.0" font-size="13" fill="#59636e" text-anchor="middle">unless muted or snoozed</text>
<g filter="url(#lift)"><rect x="36" y="292" width="186" height="76" rx="11" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/></g>
