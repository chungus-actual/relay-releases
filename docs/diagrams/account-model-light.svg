<rect x="36.5" y="120.5" width="185" height="44" rx="10.5" fill="url(#wash-acct-light)"/>
<text x="129.0" y="140.5" font-size="11" font-weight="700" letter-spacing="1.3" fill="#1a8f6e" text-anchor="middle">ACCOUNT</text>
<text x="129.0" y="161.5" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Gmail, work</text>
<text x="129.0" y="180.5" font-size="13" fill="#59636e" text-anchor="middle">name, colour, zoom,</text>
<text x="129.0" y="197.5" font-size="13" fill="#59636e" text-anchor="middle">mute</text>
